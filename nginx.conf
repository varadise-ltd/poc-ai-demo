# AI Cam POC Center 前端 nginx 配置
# - SPA 静态托管（history fallback 到 index.html）
# - /api/ 反向代理到后端容器（compose 服务名 backend）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 人脸图片上传（multipart）等请求体放宽到 20MB（nginx 默认 1MB 会 413）
    client_max_body_size 20m;

    # 每次部署 bundle 文件名会变（带 hash），index.html 绝不能被缓存，
    # 否则浏览器拿到旧 index.html 就永远加载旧 JS，新功能看似「没生效」。
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MJPEG 实时检测流（/api/stream）必需：关闭缓冲、超长读超时，
        # 否则 nginx 会缓存帧导致画面不实时、或 60s 后断开。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA history 模式 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以永久缓存（文件名变了内容一定变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
