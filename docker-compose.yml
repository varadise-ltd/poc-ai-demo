# 独立前端：Node 静态服务器提供页面，无 nginx、无 API 反向代理。
# VITE_API_BASE 为构建时参数，修改后必须重新 build，restart 不生效。
# 不依赖后端 Compose 项目或共享 Docker 网络。
name: poc-ai-demo

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.standalone
      args:
        VITE_BACKEND_TARGET: "${POC_BACKEND_TARGET:-local}"
        VITE_LOCAL_API_BASE: "${POC_LOCAL_API_BASE:-https://internal-poc-aicctv-dev.varadise.cloud}"
        VITE_CLOUD_API_BASE: "${POC_CLOUD_API_BASE:-}"
    image: poc-ai-demo:standalone
    container_name: poc-ai-demo
    ports:
      - "${POC_FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped